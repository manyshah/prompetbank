</style></head><body><div class="container"><div class="title">
 نیمرخ دیواری نوآر طلایی 🟡

</div><textarea id="promptText" hidden>Vertical 9:16 medium portrait of a young adult female seated against a gradient wall in side profile, head turned softly in contemplation, matte black crewneck top, minimal ear jewelry, dramatic hard-edged spotlight casting strong shadow outline, warm yellow to deep gray wall, right-side split lighting, bright highlights, deep shadows, painterly cinematic noir mood, built 100% from the unaltered facial features of the reference image, preserve the original face 100% exactly, hair unchanged, high-end cinematic photography, professional depth of field, natural/cinematic color grading. STRICT FEMININE LOCK: elegant feminine styling only, graceful female outfit, soft feminine proportions, refined pose, tasteful feminine accessory, no masculine tailoring, no boxy menswear, no masculine body language, no facial or hair alteration. single person only, one subject, natural anatomy, realistic hands, realistic eyes, no distorted face, no extra fingers, no warped body, realistic skin texture, no plastic skin, no over-retouching, completely clean and soft background, smooth uniform gradient, no noise, no grain, no film grain, no sensor noise, no compression artifacts, no banding, perfectly smooth color transitions, extremely high and sharp image quality, soft clean bokeh, no noisy texture in the background</textarea></div><script>

async function copyPrompt(){

const text =
document.getElementById("promptText").value;

try{

await navigator.clipboard.writeText(text);

document.getElementById("success").style.display="block";

setTimeout(function(){

document.getElementById("success").style.display="none";

},2000);

}catch(error){

const textarea =
document.getElementById("promptText");

textarea.hidden = false;

textarea.select();

document.execCommand("copy");

textarea.hidden = true;

document.getElementById("success").style.display="block";

setTimeout(function(){

document.getElementById("success").style.display="none";

},2000);

}

}

</script></body>
