<!DOCTYPE html><html lang="fa" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>زن کت طوسی خیابانی</title><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
}

body{
background:url('https://s21.uupload.ir/files/gambegampanjom/بانک%20پرامپت/لوگو%20و%20تصاویر%20اولیه/file_00000000500471f49b917570bded0ba3.png') center center/cover no-repeat fixed;
min-height:100vh;
color:#fff;

overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
inset:0;
background:rgba(0,0,0,.75);
z-index:0;
}

.container{
position:relative;
z-index:1;

width:100%;
max-width:700px;

margin:0 auto;

padding:20px;
}

.title{
text-align:center;
font-size:26px;
font-weight:bold;
margin:25px 0;

text-shadow:
0 0 15px rgba(120,100,255,.35);
}

.image{
display:block;

width:100%;
max-width:100%;

height:auto;

border-radius:24px;

margin:0 auto 20px auto;

box-shadow:
0 0 25px rgba(120,100,255,.15);
}

.copy-btn{

display:block;

width:100%;

padding:18px;

border:none;

border-radius:20px;

cursor:pointer;

font-size:18px;
font-weight:bold;
color:#fff;

background:linear-gradient(
135deg,
rgba(90,70,255,.30),
rgba(0,180,255,.18)
);

backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);

box-shadow:
0 0 20px rgba(110,90,255,.25),
0 0 40px rgba(0,180,255,.12);

transition:.3s;

}

.copy-btn:hover{

transform:translateY(-2px);

background:linear-gradient(
135deg,
rgba(110,90,255,.40),
rgba(0,180,255,.25)
);

}

.success{

display:none;

text-align:center;

margin-top:15px;

font-weight:bold;

color:#00ff88;

}

textarea{
position:absolute;
left:-9999px;
}

</style></head><body><div class="container"><div class="title">
زن کت طوسی خیابانی ⚡
</div><img
class="image"
src="https://s15.uupload.ir/files/gambegampanjom/بانک%20پرامپت/لوگو%20و%20تصاویر%20اولیه/تصاویر%20زن%20و%20مرد/کت%20طوسی%20خیابانی.jpg">

<button
class="copy-btn"
onclick="copyPrompt()">

📋 کپی پرامپت

</button><div
id="success"
class="success">✅ پرامپت کپی شد

</div><textarea id="promptText">high-end editorial fashion photography, vertical 9:16, ultra-realistic high-angle street portrait of a young adult female looking up at the camera on textured asphalt, wearing an oversized gray blazer, white fitted top, gray tailored trousers and black pointed shoes, small white handbag in one hand, dramatic midday sunlight, sharp shadows, confident direct gaze, modern city fashion energy, realistic skin texture, built 100% from the unaltered facial features of the reference image, preserve the original face 100% exactly, hair unchanged, no smoothing, no text, no logo. STRICT FEMININE LOCK: elegant feminine styling only, refined pose.</textarea></div><script>

function copyPrompt(){

var copyText =
document.getElementById("promptText");

copyText.style.display="block";

copyText.select();

copyText.setSelectionRange(0,99999);

document.execCommand("copy");

copyText.style.display="none";

document.getElementById("success").style.display="block";

setTimeout(function(){

document.getElementById("success").style.display="none";

},2000);

}

</script></body>
</html>
